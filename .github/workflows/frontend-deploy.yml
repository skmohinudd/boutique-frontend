name: Deploy Boutique Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  S3_BUCKET: boutique-dev-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3SF8B4MHWNVIT
  APP_DIR: react-app

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          echo "Hostname:"
          hostname
          echo "User:"
          whoami
          echo "Working directory:"
          pwd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build frontend
        working-directory: react-app
        run: npm run build

      - name: Verify build output
        working-directory: react-app
        run: |
          test -f dist/index.html
          test -d dist/assets

          echo "Generated bundles:"
          grep -oE 'assets/index-[^"]+\.(js|css)' dist/index.html || true

      - name: Debug GitHub identity
        run: |
          echo "Repository = $GITHUB_REPOSITORY"
          echo "Ref        = $GITHUB_REF"
          echo "Actor      = $GITHUB_ACTOR"

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::663130434910:role/BoutiqueFrontendDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload hashed assets
        working-directory: react-app
        run: |
          aws s3 sync dist/assets/ \
            s3://${S3_BUCKET}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload static files
        working-directory: react-app
        run: |
          aws s3 sync dist/ \
            s3://${S3_BUCKET}/ \
            --delete \
            --exclude "assets/*"

      - name: Upload index.html with no-cache
        working-directory: react-app
        run: |
          aws s3 cp dist/index.html \
            s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Verify deployed index.html
        working-directory: react-app
        run: |
          LOCAL_JS=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)

          REMOTE_JS=$(aws s3 cp s3://${S3_BUCKET}/index.html - \
            | grep -oE 'assets/index-[^"]+\.js' \
            | head -1)

          echo "Local bundle:  $LOCAL_JS"
          echo "Remote bundle: $REMOTE_JS"

          if [ "$LOCAL_JS" != "$REMOTE_JS" ]; then
            echo "ERROR: S3 is still serving a different frontend build."
            exit 1
          fi

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Verify website
        run: |
          STATUS=$(curl \
            -s \
            -o /tmp/site.html \
            -w "%{http_code}" \
            https://needystuff.in/)

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"

          grep -q '<div id="root">' /tmp/site.html

          echo "Frontend deployment successful."
