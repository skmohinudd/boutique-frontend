name: Deploy Boutique Frontend DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent multiple DEV deployments from overwriting each other.
concurrency:
  group: boutique-frontend-dev
  cancel-in-progress: true

# GitHub only needs repository read access and OIDC permission for AWS.
permissions:
  contents: read
  id-token: write

env:
  # AWS deployment configuration.
  AWS_REGION: us-east-1
  S3_BUCKET: boutique-dev-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3SF8B4MHWNVIT
  APP_DIR: react-app

  # Basic frontend application configuration.
  VITE_APP_NAME: Boutique
  VITE_APP_ENV: dev

  # All frontend API requests go through the public Boutique API hostname.
  VITE_PRODUCT_API_URL: https://api.needystuff.in
  VITE_INVENTORY_API_URL: https://api.needystuff.in
  VITE_USER_API_URL: https://api.needystuff.in
  VITE_CART_API_URL: https://api.needystuff.in
  VITE_ORDER_API_URL: https://api.needystuff.in
  VITE_PAYMENT_API_URL: https://api.needystuff.in
  VITE_CHECKOUT_API_URL: https://api.needystuff.in
  VITE_SHIPPING_API_URL: https://api.needystuff.in

  # Shared frontend API timeout.
  VITE_API_TIMEOUT_MS: "10000"

  # Basic commerce configuration used by the frontend.
  VITE_DEFAULT_CURRENCY: USD
  VITE_DEMO_CARD_LAST4: "4242"

  # Cognito is the authentication provider and values come from GitHub Repository Variables.
  VITE_AUTH_MODE: cognito
  VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
  VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
  VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
  VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
  VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
  VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
  VITE_COGNITO_SCOPE: ${{ vars.VITE_COGNITO_SCOPE }}

  # Frontend feature switches.
  VITE_ENABLE_ADVERTISEMENTS: "true"
  VITE_ENABLE_RECOMMENDATIONS: "false"
  VITE_ENABLE_CURRENCY: "false"
  VITE_ENABLE_ASSISTANT: "false"

jobs:

  deploy:
    name: Build and Deploy DEV
    runs-on: ubuntu-latest

    # Stop a stuck frontend deployment automatically.
    timeout-minutes: 20

    steps:

      # Download the repository source code onto the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js and reuse the npm dependency cache between workflow runs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # Install exactly the dependency versions recorded in package-lock.json.
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # Catch frontend code and syntax problems before creating the deployment bundle.
      - name: Lint frontend
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      # Fail immediately if any required API or Cognito configuration is missing.
      - name: Validate frontend configuration
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_VARS=(
            VITE_PRODUCT_API_URL
            VITE_INVENTORY_API_URL
            VITE_USER_API_URL
            VITE_CART_API_URL
            VITE_ORDER_API_URL
            VITE_PAYMENT_API_URL
            VITE_CHECKOUT_API_URL
            VITE_SHIPPING_API_URL
            VITE_COGNITO_REGION
            VITE_COGNITO_USER_POOL_ID
            VITE_COGNITO_CLIENT_ID
            VITE_COGNITO_DOMAIN
            VITE_COGNITO_REDIRECT_URI
            VITE_COGNITO_LOGOUT_URI
            VITE_COGNITO_SCOPE
          )

          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR:-}" ]; then
              echo "ERROR: Missing required variable: $VAR"
              exit 1
            fi
          done

          echo "Frontend configuration validation passed."

      # Compile React/Vite source code and inject the VITE environment values into the browser bundle.
      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # Verify that the generated bundle exists and contains API and Cognito configuration.
      - name: Validate frontend bundle
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -d dist/assets

          if grep -R -qE 'http://localhost:808[0-9]' dist/; then
            echo "ERROR: localhost backend URL found in frontend bundle."
            exit 1
          fi

          if ! grep -R -q "api.needystuff.in" dist/; then
            echo "ERROR: Boutique API hostname is missing from frontend bundle."
            exit 1
          fi

          if ! grep -R -q "amazoncognito.com" dist/; then
            echo "ERROR: Cognito domain is missing from frontend bundle."
            exit 1
          fi

          echo "Frontend bundle validation passed."

      # Exchange the GitHub OIDC token for temporary AWS credentials without AWS access keys.
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::663130434910:role/BoutiqueFrontendDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # Upload hashed Vite assets with long-term caching because their filenames change with content.
      - name: Upload hashed assets
        working-directory: ${{ env.APP_DIR }}
        run: |
          aws s3 sync dist/assets/ \
            "s3://${S3_BUCKET}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

      # Upload remaining non-hashed frontend files separately from index.html.
      - name: Upload static files
        working-directory: ${{ env.APP_DIR }}
        run: |
          aws s3 sync dist/ \
            "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300" \
            --only-show-errors

      # Upload index.html without browser caching so users receive the latest Vite bundle references.
      - name: Upload index.html
        working-directory: ${{ env.APP_DIR }}
        run: |
          aws s3 cp dist/index.html \
            "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html" \
            --only-show-errors

      # Clear CloudFront cache so the newly deployed frontend becomes available immediately.
      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

          echo "CloudFront invalidation completed."

      # Verify that the live website and its generated JavaScript bundle are reachable.
      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --output /tmp/site.html \
            --write-out "%{http_code}" \
            https://needystuff.in/)

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Website returned HTTP $STATUS"
            exit 1
          fi

          grep -q '<div id="root">' /tmp/site.html

          LIVE_JS=$(grep -oE '/assets/index-[^"]+\.js' /tmp/site.html | head -1)

          if [ -z "$LIVE_JS" ]; then
            echo "ERROR: JavaScript bundle reference not found."
            exit 1
          fi

          JS_STATUS=$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "https://needystuff.in${LIVE_JS}")

          if [ "$JS_STATUS" != "200" ]; then
            echo "ERROR: JavaScript bundle returned HTTP $JS_STATUS"
            exit 1
          fi

          echo "Boutique frontend deployed successfully."