name: Deploy Boutique Frontend DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  S3_BUCKET: boutique-dev-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3SF8B4MHWNVIT
  APP_DIR: react-app

  # ============================================================
  # FRONTEND APPLICATION
  # ============================================================

  VITE_APP_NAME: Boutique
  VITE_APP_ENV: dev

  # ============================================================
  # BACKEND API
  #
  # Every frontend API client uses the same public ALB hostname.
  # Individual paths are added by the frontend API clients.
  # ============================================================

  VITE_PRODUCT_API_URL: https://api.needystuff.in
  VITE_INVENTORY_API_URL: https://api.needystuff.in
  VITE_USER_API_URL: https://api.needystuff.in
  VITE_CART_API_URL: https://api.needystuff.in
  VITE_ORDER_API_URL: https://api.needystuff.in
  VITE_PAYMENT_API_URL: https://api.needystuff.in
  VITE_CHECKOUT_API_URL: https://api.needystuff.in
  VITE_SHIPPING_API_URL: https://api.needystuff.in

  # ============================================================
  # API SETTINGS
  # ============================================================

  VITE_API_TIMEOUT_MS: "10000"

  # ============================================================
  # COMMERCE
  # ============================================================

  VITE_DEFAULT_CURRENCY: USD
  VITE_DEMO_CARD_LAST4: "4242"

  # ============================================================
  # DEV AUTHENTICATION
  #
  # Current frontend uses local authentication.
  # Later replace with Cognito.
  # ============================================================

  VITE_AUTH_MODE: local
  VITE_COGNITO_REGION: ""
  VITE_COGNITO_USER_POOL_ID: ""
  VITE_COGNITO_CLIENT_ID: ""

  # ============================================================
  # FEATURE FLAGS
  # ============================================================

  VITE_ENABLE_ADVERTISEMENTS: "true"
  VITE_ENABLE_RECOMMENDATIONS: "false"
  VITE_ENABLE_CURRENCY: "false"
  VITE_ENABLE_ASSISTANT: "false"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # RUNNER INFORMATION
      # ========================================================

      - name: Show runner information
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"
          hostname
          whoami
          pwd

      # ========================================================
      # NODE
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      # ========================================================
      # LINT
      # ========================================================

      - name: Lint frontend
        working-directory: react-app
        run: npm run lint

      # ========================================================
      # VERIFY REQUIRED VITE CONFIG BEFORE BUILD
      #
      # This prevents another successful workflow that generates
      # a broken browser bundle.
      # ========================================================

      - name: Validate frontend build configuration
        run: |
          echo "Checking mandatory Vite variables..."

          REQUIRED_VARS=(
            VITE_PRODUCT_API_URL
            VITE_INVENTORY_API_URL
            VITE_USER_API_URL
            VITE_CART_API_URL
            VITE_ORDER_API_URL
            VITE_PAYMENT_API_URL
            VITE_CHECKOUT_API_URL
            VITE_SHIPPING_API_URL
          )

          FAILED=0

          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR:-}" ]; then
              echo "ERROR: $VAR is missing"
              FAILED=1
            else
              echo "OK: $VAR"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Frontend configuration validation failed."
            exit 1
          fi

          echo "All required frontend API variables are configured."

      # ========================================================
      # BUILD
      # ========================================================

      - name: Build DEV frontend
        working-directory: react-app
        run: npm run build

      # ========================================================
      # VALIDATE BUILD
      # ========================================================

      - name: Validate DEV bundle
        working-directory: react-app
        run: |
          echo "Checking generated DEV frontend bundle..."

          test -f dist/index.html
          test -d dist/assets

          JS_FILE=$(find dist/assets -type f -name '*.js' | head -1)
          CSS_FILE=$(find dist/assets -type f -name '*.css' | head -1)

          test -n "$JS_FILE"
          test -n "$CSS_FILE"

          echo "JS bundle:  $JS_FILE"
          echo "CSS bundle: $CSS_FILE"

          if grep -R -E 'http://localhost:808[0-9]' dist/; then
            echo "ERROR: localhost backend URL found in deployable DEV bundle."
            exit 1
          fi

          if ! grep -R "api.needystuff.in" dist/ >/dev/null; then
            echo "ERROR: DEV API hostname was not compiled into the bundle."
            exit 1
          fi

          echo "DEV frontend bundle validation passed."

      # ========================================================
      # AWS AUTHENTICATION
      # ========================================================

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::663130434910:role/BoutiqueFrontendDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ========================================================
      # HASHED ASSETS
      #
      # Safe to cache for a long time because Vite changes the
      # filename whenever the content changes.
      # ========================================================

      - name: Upload hashed assets
        working-directory: react-app
        run: |
          aws s3 sync dist/assets/ \
            s3://${S3_BUCKET}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # ========================================================
      # STATIC FILES
      # ========================================================

      - name: Upload static files
        working-directory: react-app
        run: |
          aws s3 sync dist/ \
            s3://${S3_BUCKET}/ \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html"

      # ========================================================
      # INDEX.HTML
      #
      # Never aggressively cache SPA index.html.
      # ========================================================

      - name: Upload index.html with no-cache
        working-directory: react-app
        run: |
          aws s3 cp dist/index.html \
            s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # ========================================================
      # VERIFY S3 ARTIFACT
      # ========================================================

      - name: Verify deployed index.html
        working-directory: react-app
        run: |
          LOCAL_JS=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)

          REMOTE_JS=$(aws s3 cp s3://${S3_BUCKET}/index.html - \
            | grep -oE 'assets/index-[^"]+\.js' \
            | head -1)

          echo "Local bundle:  $LOCAL_JS"
          echo "Remote bundle: $REMOTE_JS"

          test "$LOCAL_JS" = "$REMOTE_JS"

      # ========================================================
      # CLOUDFRONT
      # ========================================================

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      # ========================================================
      # PUBLIC WEBSITE VERIFICATION
      # ========================================================

      - name: Verify website
        run: |
          STATUS=$(curl \
            -s \
            -o /tmp/site.html \
            -w "%{http_code}" \
            https://needystuff.in/)

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"

          grep -q '<div id="root">' /tmp/site.html

          LIVE_JS=$(grep -oE '/assets/index-[^"]+\.js' /tmp/site.html | head -1)

          echo "Live JavaScript bundle: $LIVE_JS"

          test -n "$LIVE_JS"

          JS_STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            "https://needystuff.in${LIVE_JS}")

          echo "Live JavaScript HTTP status: $JS_STATUS"

          test "$JS_STATUS" = "200"

          echo "Boutique DEV frontend deployment successful."