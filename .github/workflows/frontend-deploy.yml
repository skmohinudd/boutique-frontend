name: Deploy Boutique Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  S3_BUCKET: boutique-dev-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E3SF8B4MHWNVIT
  APP_DIR: react-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build frontend
        working-directory: react-app
        run: npm run build

      - name: Verify build output
        working-directory: react-app
        run: |
          set -e

          test -f dist/index.html
          test -d dist/assets

          echo "Generated bundles:"
          grep -oE 'assets/index-[^"]+\.(js|css)' dist/index.html || true

      - name: Debug GitHub identity
        run: |
          echo "Repository = $GITHUB_REPOSITORY"
          echo "Ref        = $GITHUB_REF"
          echo "Actor      = $GITHUB_ACTOR"

      - name: Debug actual GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c \
            'import sys,json; print(json.load(sys.stdin)["value"])')

          export TOKEN

          python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("===== ACTUAL GITHUB OIDC CLAIMS =====")

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "environment",
              "job_workflow_ref"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::663130434910:role/BoutiqueFrontendDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload hashed assets
        working-directory: react-app
        run: |
          set -e

          aws s3 sync dist/assets/ \
            s3://${S3_BUCKET}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload static files
        working-directory: react-app
        run: |
          set -e

          aws s3 sync dist/ \
            s3://${S3_BUCKET}/ \
            --delete \
            --exclude "assets/*"

      - name: Upload index.html with no-cache
        working-directory: react-app
        run: |
          set -e

          aws s3 cp dist/index.html \
            s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Verify deployed index.html
        working-directory: react-app
        run: |
          set -euo pipefail

          LOCAL_JS=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)

          REMOTE_JS=$(aws s3 cp s3://${S3_BUCKET}/index.html - \
            | grep -oE 'assets/index-[^"]+\.js' \
            | head -1)

          echo "Local bundle:  $LOCAL_JS"
          echo "Remote bundle: $REMOTE_JS"

          if [ "$LOCAL_JS" != "$REMOTE_JS" ]; then
            echo "ERROR: S3 is serving a different frontend build."
            exit 1
          fi

          echo "S3 deployment verification passed."

      - name: Verify JavaScript bundle exists in S3
        working-directory: react-app
        run: |
          set -euo pipefail

          JS_FILE=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)

          echo "Checking S3 object: $JS_FILE"

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key "${JS_FILE}"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

          echo "CloudFront invalidation completed."

      - name: Verify website
        run: |
          set -euo pipefail

          STATUS=$(curl \
            -s \
            -o /tmp/site.html \
            -w "%{http_code}" \
            https://needystuff.in/)

          echo "HTTP status: $STATUS"

          test "$STATUS" = "200"

          grep -q '<div id="root">' /tmp/site.html

          echo "Frontend deployment successful."
